<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Web dictaphone</title>
    <link href="css/audiorecord.css" rel="stylesheet" type="text/css">
</head>

<body>

    <div class="wrapper">

        <header>
            <h1>RECORD AUDIO</h1>
        </header>
        <div id="message_box">
            <input type="text" id="message_input" placeholder="Type a message...">
            <button id="send_button">Send</button>
            <button id="rec_audio_toggle">Record Audio</button>
        </div>

    </div>
    <script src="js/audiorecord.js"></script>

</body>

</html>
